[project]
name = "agentic-voice-shopping-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "doit>=0.37.0",
    "httpx>=0.28.1",
    "kagglehub>=1.0.3",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "mcp>=1.20,<2",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "proofagent-harness>=0.14.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

# Installs the repo's packages (editable) on `uv sync`, so they import from any
# working directory: doit, `streamlit run`, the MCP server, scripts/.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "config", "agent", "mocks", "mcp_server", "rag"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
