[project]
name = "agentic-voice-shopping-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "doit>=0.37.0",
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

# Installs `contracts`, `config` and `rag` (editable) on `uv sync`, so they import from any
# working directory: doit, `streamlit run`, the MCP server, scripts/.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "config", "rag"]
